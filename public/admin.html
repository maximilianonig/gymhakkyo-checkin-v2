<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Gym Hakkyo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="login-section" class="container">
    <h1>Ingreso Administrador</h1>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Contraseña" />
    <button id="loginBtn">Ingresar</button>
    <p id="errorMsg" style="color:red"></p>
  </div>

  <div id="admin-panel" style="display:none">
    <div class="container">
      <h1>Panel de Administracion</h1>

      <div class="filtros-container">
        <button class="toggle-filtros" onclick="document.querySelector('.filtros-desplegable').classList.toggle('abierto')">🎛️ Mostrar/Ocultar filtros</button>
        <button id="btn-actualizar">🔄 Actualizar</button>

        <div class="filtros-desplegable">
          <div class="filtro-izquierda">
            <select id="filtro-rol">
              <option value="">Todos los roles</option>
              <option value="Recepcionista">Recepcionista</option>
              <option value="Profesor">Profesor</option>
              <option value="Suplente">Suplente</option>
            </select>
            <select id="filtro-sede">
              <option value="">Todas las sedes</option>
              <option value="Santa Fe">Santa Fe</option>
              <option value="Borges">Borges</option>
              <option value="Darregueyra">Darregueyra</option>
              <option value="Lacroze">Lacroze</option>
              <option value="Callao">Callao</option>
              <option value="Subzero">Subzero</option>
              <option value="Ciudad">Ciudad</option>
              <option value="No detectada">No detectada</option>
            </select>
            <select id="filtro-tipo">
              <option value="">Entradas y salidas</option>
              <option value="entrada">Solo entradas</option>
              <option value="salida">Solo salidas</option>
            </select>
            <input type="date" id="filtro-fecha" />

             <div class="filtro-derecha">
          <label for="desde">Desde</label>
          <input type="date" id="fecha-desde" />
          <label for="hasta">Hasta</label>
          <input type="date" id="fecha-hasta" />
          <button onclick="exportarExcel()">📤 Exportar a Excel</button>
          <button onclick="exportarAnalisisPro()">📥 GRAFICO</button>
          <canvas id="graficoTardes" style="max-width:100%; margin-top: 2rem;"></canvas>
        </div>
            <button id="limpiarFiltros">🔄 Limpiar filtros</button>
          </div>
        </div>
      </div>

      <p id="contador-hoy">Ingresos hoy: 0</p>
      <div id="lista-ingresos" class="grid"></div>
      <button onclick="logout()">Cerrar sesión</button>
    </div>
  </div>

  <!-- Firebase y lógica -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWboAJXuO7feFynrKDefFUW2YWNEt3oF0",
      authDomain: "gymhakkyo-ingreso.firebaseapp.com",
      projectId: "gymhakkyo-ingreso",
      storageBucket: "gymhakkyo-ingreso.appspot.com",
      messagingSenderId: "413099978087",
      appId: "1:413099978087:web:cacfd3021a87dc3cd013c2",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginBtn = document.getElementById("loginBtn");
    loginBtn.addEventListener("click", async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        document.getElementById("errorMsg").textContent = error.message;
      }
    });

onAuthStateChanged(auth, user => {
  if (user && user.email === "admin@gymhakkyo.com.ar") { // 🔐 Cambiá por tu email
    document.getElementById("login-section").style.display = "none";
    document.getElementById("admin-panel").style.display = "block";
    cargarRegistros();
    
  } else {
    alert("Acceso denegado.");
    signOut(auth);
  }
});


    window.logout = () => signOut(auth);

    function cargarRegistros() {
      const contenedor = document.getElementById("lista-ingresos");
      const filtroRol = document.getElementById("filtro-rol");
      const filtroSede = document.getElementById("filtro-sede");
      const filtroFecha = document.getElementById("filtro-fecha");
      const filtroTipo = document.getElementById("filtro-tipo");
      const btnLimpiarFiltros = document.getElementById("limpiarFiltros");
      const contadorHoy = document.getElementById("contador-hoy");
      let cache = [];

      function renderizar(data) {
        const rol = filtroRol.value.toLowerCase();
        const sede = filtroSede.value.toLowerCase();
        const tipo = filtroTipo.value.toLowerCase();
        const fechaFiltro = filtroFecha.value;

        contenedor.innerHTML = "";

        const filtrado = data.filter(item => {
          const itemRol = item.rol?.toLowerCase() || "";
          const itemSede = item.sede?.toLowerCase() || "";
          const itemTipo = item.tipo?.toLowerCase() || "entrada";

          let itemFecha = "";
          if (item.timestamp?.toDate) {
            itemFecha = item.timestamp.toDate().toISOString().slice(0, 10);
          }

          const cumpleRol = !rol || itemRol === rol;
          const cumpleSede = !sede || itemSede === sede;
          const cumpleTipo = !tipo || itemTipo === tipo;
          const cumpleFecha = !fechaFiltro || itemFecha === fechaFiltro;

          return cumpleRol && cumpleSede && cumpleTipo && cumpleFecha;
        });

        const hoy = new Date().toISOString().slice(0, 10);
        const ingresosHoy = data.filter(i => {
          const f = i.timestamp?.toDate?.().toISOString().slice(0, 10);
          return f === hoy;
        }).length;
        contadorHoy.textContent = `Ingresos hoy: ${ingresosHoy}`;

        filtrado.forEach(data => {
          const fecha = data.timestamp?.toDate?.().toLocaleDateString("es-AR") || "Sin fecha";
          const hora = data.timestamp?.toDate?.().toLocaleTimeString("es-AR", {
            hour: "2-digit", minute: "2-digit", hour12: false
          }) || data.hora || "Sin hora";

          const div = document.createElement("div");
          div.classList.add("ingreso");
          div.innerHTML = `
            <p><strong>🧑‍💼 ${data.tipo === "salida" ? "Salida" : "Ingreso"}</strong></p>
            <p><strong>Rol:</strong> ${data.rol || "N/A"}</p>
            <p><strong>Nombre:</strong> ${data.nombre || "No informado"}</p>
            <p><strong>Dirección:</strong> ${data.direccion || "No disponible"}</p>
            <p><strong>Sede:</strong> ${data.sede || "No detectada"}</p>
            <p><strong>Fecha:</strong> ${fecha}</p>
            <p><strong>Hora:</strong> ${hora}</p>
            <img src="${data.imagenBase64}" alt="Selfie"/>
          `;
          contenedor.appendChild(div);
        });
      }

      const q = query(collection(db, "ingresos"), orderBy("timestamp", "desc"));
      onSnapshot(q, (snapshot) => {
        cache = snapshot.docs.map(doc => doc.data());
        renderizar(cache);
      });

      filtroRol.addEventListener("change", () => renderizar(cache));
      filtroSede.addEventListener("change", () => renderizar(cache));
      filtroTipo.addEventListener("change", () => renderizar(cache));
      filtroFecha.addEventListener("change", () => renderizar(cache));
      btnLimpiarFiltros.addEventListener("click", () => {
        filtroRol.value = "";
        filtroSede.value = "";
        filtroFecha.value = "";
        filtroTipo.value = "";
        renderizar(cache);
      });

      document.getElementById("btn-actualizar").addEventListener("click", () => {
        location.reload();
      });
    }

window.exportarExcel = () => {
  import('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js').then(() => {
    const tabla = [];

    const sedesEspeciales = ["Subzero", "Lacroze"];

    document.querySelectorAll(".ingreso").forEach(div => {
      const fila = {};

      const tipoTexto = div.querySelector("p strong")?.textContent?.toLowerCase() || "entrada";
      const tipo = tipoTexto.includes("salida") ? "salida" : "entrada";
      fila["Tipo"] = tipo.charAt(0).toUpperCase() + tipo.slice(1); // Entrada / Salida

      div.querySelectorAll("p").forEach(p => {
        const parts = p.textContent.split(":");
        const label = parts[0]?.trim();
        const value = parts.slice(1).join(":").trim();
        if (label && value) fila[label] = value;
      });

      const horaStr = fila["Hora"];
      const sede = fila["Sede"] || "No detectada";

      if (!horaStr || !sede) {
        fila["Minutos tarde"] = "";
        fila["Minutos antes de irse"] = "";
        tabla.push(fila);
        return;
      }

      const [h, m] = horaStr.split(":").map(x => parseInt(x));
      const minutosTotales = h * 60 + m;

      const esTurnoManana = minutosTotales < 900;

      // Definir hora base según sede y turno
      let baseEntrada = 0;
      let baseSalida = 0;

      if (esTurnoManana) {
        baseEntrada = sedesEspeciales.includes(sede) ? 450 : 420;  // 7:30 o 7:00
        baseSalida = 900; // 15:00
      } else {
        baseEntrada = 900; // 15:00 todos
        baseSalida = sedesEspeciales.includes(sede) ? 1350 : 1380; // 22:30 o 23:00
      }

      if (tipo === "entrada") {
        fila["Minutos tarde"] = Math.max(0, minutosTotales - baseEntrada);
        fila["Minutos antes de irse"] = "";
      } else if (tipo === "salida") {
        fila["Minutos tarde"] = "";
        fila["Minutos antes de irse"] = Math.max(0, baseSalida - minutosTotales);
      }

      tabla.push(fila);
    });

    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(tabla);
    XLSX.utils.book_append_sheet(wb, ws, "Ingresos");
    XLSX.writeFile(wb, "ingresos.xlsx");
  });
};

   window.exportarAnalisisPro = () => {
  const sedesEspeciales = ["Subzero", "Lacroze"];
  const datos = {};

  document.querySelectorAll(".ingreso").forEach(div => {
    function normalizarNombre(nombre) {
  return nombre
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]/g, "");
}

const nombreRaw = div.querySelector("p:nth-child(3)")?.textContent.split(":")[1]?.trim() || "No informado";
const nombre = normalizarNombre(nombreRaw);

    const tipoTexto = div.querySelector("p strong")?.textContent?.toLowerCase() || "";
    const tipo = tipoTexto.includes("salida") ? "salida" : "entrada";
    const sede = div.querySelector("p:nth-child(5)")?.textContent.split(":")[1]?.trim() || "";
    const horaStr = div.querySelector("p:nth-child(7)")?.textContent.split(":")[1]?.trim() || "";

    if (!horaStr) return;

    const [h, m] = horaStr.split(":").map(x => parseInt(x));
    const minutos = h * 60 + m;

    const esEspecial = sedesEspeciales.includes(sede);
    const esTurnoManana = minutos < 900;

    // Hora base según sede y turno
    let baseEntrada = 0;
    let baseSalida = 0;

    if (esTurnoManana) {
      baseEntrada = esEspecial ? 450 : 420; // 7:30 o 7:00
      baseSalida = 900; // 15:00
    } else {
      baseEntrada = 900; // 15:00 para todos
      baseSalida = esEspecial ? 1350 : 1380; // 22:30 o 23:00
    }

    const clave = nombre;

    if (!datos[clave]) {
      datos[clave] = {
        tardeManana: 0,
        tardeTarde: 0,
        antesManana: 0,
        antesTarde: 0
      };
    }

    if (tipo === "entrada") {
      if (minutos > baseEntrada) {
        esTurnoManana ? datos[clave].tardeManana++ : datos[clave].tardeTarde++;
      }
    }

    if (tipo === "salida") {
      if (minutos < baseSalida) {
        esTurnoManana ? datos[clave].antesManana++ : datos[clave].antesTarde++;
      }
    }
  });

  const labels = Object.keys(datos);
  const tardeManana = labels.map(n => datos[n].tardeManana);
  const tardeTarde = labels.map(n => datos[n].tardeTarde);
  const antesManana = labels.map(n => datos[n].antesManana);
  const antesTarde = labels.map(n => datos[n].antesTarde);

  const ctx = document.getElementById("graficoTardes").getContext("2d");
  new Chart(ctx, {
    type: "bar",
    data: {
      labels,
      datasets: [
        {
          label: "🟡 Llegó tarde (mañana)",
          data: tardeManana,
          backgroundColor: "rgba(255, 206, 86, 0.7)"
        },
        {
          label: "🟠 Llegó tarde (tarde)",
          data: tardeTarde,
          backgroundColor: "rgba(255, 159, 64, 0.7)"
        },
        {
          label: "🔵 Se fue antes (mañana)",
          data: antesManana,
          backgroundColor: "rgba(54, 162, 235, 0.7)"
        },
        {
          label: "🔴 Se fue antes (tarde)",
          data: antesTarde,
          backgroundColor: "rgba(255, 99, 132, 0.7)"
        }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        title: {
          display: true,
          text: "Análisis PRO – Llegadas tarde y salidas anticipadas por persona y turno"
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          title: {
            display: true,
            text: "Cantidad de veces"
          }
        }
      }
    }
  });
};


  </script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</body>
</html>
