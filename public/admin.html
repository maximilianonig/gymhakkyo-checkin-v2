<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Gym Hakkyo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Panel de Administracion</h1>

    <div class="filtros-container">
      <button class="toggle-filtros" onclick="document.querySelector('.filtros-desplegable').classList.toggle('abierto')">
        🎛️ Mostrar/Ocultar filtros
      </button>
<button id="btn-actualizar">🔄 Actualizar</button>

      <div class="filtros-desplegable">
        <div class="filtro-izquierda">
          <select id="filtro-rol">
            <option value="">Todos los roles</option>
            <option value="Recepcionista">Recepcionista</option>
            <option value="Profesor">Profesor</option>
            <option value="Suplente">Suplente</option>
          </select>

          <select id="filtro-sede">
            <option value="">Todas las sedes</option>
            <option value="Santa Fe">Santa Fe</option>
            <option value="Borges">Borges</option>
            <option value="Darregueyra">Darregueyra</option>
            <option value="Lacroze">Lacroze</option>
            <option value="Callao">Callao</option>
            <option value="Subzero">Subzero</option>
            <option value="Ciudad">Ciudad</option>
            <option value="No detectada">No detectada</option>
          </select>

          <select id="filtro-tipo">
            <option value="">Entradas y salidas</option>
            <option value="entrada">Solo entradas</option>
            <option value="salida">Solo salidas</option>
          </select>

          <input type="date" id="filtro-fecha" />
          <button id="limpiarFiltros">🔄 Limpiar filtros</button>
        </div>

        <div class="filtro-derecha">
          <label for="desde">Desde</label>
          <input type="date" id="fecha-desde" />
          <label for="hasta">Hasta</label>
          <input type="date" id="fecha-hasta" />
          <button onclick="exportarExcel()">📤 Exportar a Excel</button>
          <button onclick="exportarAnalisisPro()">📥 Exportar análisis PRO</button>
<canvas id="graficoTardes" style="max-width:100%; margin-top: 2rem;"></canvas>

        </div>
      </div>
    </div>

    <p id="contador-hoy">Ingresos hoy: 0</p>
    <div id="lista-ingresos" class="grid"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      onSnapshot,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWboAJXuO7feFynrKDefFUW2YWNEt3oF0",
      authDomain: "gymhakkyo-ingreso.firebaseapp.com",
      projectId: "gymhakkyo-ingreso",
      storageBucket: "gymhakkyo-ingreso.appspot.com",
      messagingSenderId: "413099978087",
      appId: "1:413099978087:web:cacfd3021a87dc3cd013c2",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const contenedor = document.getElementById("lista-ingresos");
    const filtroRol = document.getElementById("filtro-rol");
    const filtroSede = document.getElementById("filtro-sede");
    const filtroFecha = document.getElementById("filtro-fecha");
    const filtroTipo = document.getElementById("filtro-tipo");
    const btnLimpiarFiltros = document.getElementById("limpiarFiltros");
    const contadorHoy = document.getElementById("contador-hoy");
    const fechaDesde = document.getElementById("fecha-desde");
    const fechaHasta = document.getElementById("fecha-hasta");

    let cache = [];

    function renderizar(data) {
      const rol = filtroRol.value.toLowerCase();
      const sede = filtroSede.value.toLowerCase();
      const tipo = filtroTipo.value.toLowerCase();
      const fechaFiltro = filtroFecha.value;

      contenedor.innerHTML = "";

      const filtrado = data.filter(item => {
        const itemRol = item.rol?.toLowerCase() || "";
        const itemSede = item.sede?.toLowerCase() || "";
        const itemTipo = item.tipo?.toLowerCase() || "entrada";

        let itemFecha = "";
        if (item.timestamp?.toDate) {
          itemFecha = item.timestamp.toDate().toISOString().slice(0, 10);
        }

        const cumpleRol = !rol || itemRol === rol;
        const cumpleSede = !sede || itemSede === sede;
        const cumpleTipo = !tipo || itemTipo === tipo;
        const cumpleFecha = !fechaFiltro || itemFecha === fechaFiltro;

        return cumpleRol && cumpleSede && cumpleTipo && cumpleFecha;
      });

      const hoy = new Date().toISOString().slice(0, 10);
      const ingresosHoy = data.filter(i => {
        const f = i.timestamp?.toDate?.().toISOString().slice(0, 10);
        return f === hoy;
      }).length;
      contadorHoy.textContent = `Ingresos hoy: ${ingresosHoy}`;

      filtrado.forEach(data => {
        const fecha = data.timestamp?.toDate?.().toLocaleDateString("es-AR") || "Sin fecha";
        const hora = data.timestamp?.toDate?.().toLocaleTimeString("es-AR", {
          hour: "2-digit", minute: "2-digit", hour12: false
        }) || data.hora || "Sin hora";

        const div = document.createElement("div");
        div.classList.add("ingreso");
        div.innerHTML = `
          <p><strong>🧑‍💼 ${data.tipo === "salida" ? "Salida" : "Ingreso"}</strong></p>
          <p><strong>Rol:</strong> ${data.rol || "N/A"}</p>
          <p><strong>Nombre:</strong> ${data.nombre || "No informado"}</p>
          <p><strong>Dirección:</strong> ${data.direccion || "No disponible"}</p>
          <p><strong>Sede:</strong> ${data.sede || "No detectada"}</p>
          <p><strong>Fecha:</strong> ${fecha}</p>
          <p><strong>Hora:</strong> ${hora}</p>
          <img src="${data.imagenBase64}" alt="Selfie"/>
        `;
        contenedor.appendChild(div);
      });
    }

    filtroRol.addEventListener("change", () => renderizar(cache));
    filtroSede.addEventListener("change", () => renderizar(cache));
    filtroTipo.addEventListener("change", () => renderizar(cache));
    filtroFecha.addEventListener("change", () => renderizar(cache));
    btnLimpiarFiltros.addEventListener("click", () => {
      filtroRol.value = "";
      filtroSede.value = "";
      filtroFecha.value = "";
      filtroTipo.value = "";
      renderizar(cache);
    });

    function exportarExcel() {
      if (!fechaDesde.value || !fechaHasta.value) {
        alert("Seleccioná ambas fechas para exportar.");
        return;
      }

      const desde = new Date(fechaDesde.value);
      const hasta = new Date(fechaHasta.value);

      const datosFiltrados = cache.filter(i => {
        const f = i.timestamp?.toDate?.();
        return f && f >= desde && f <= hasta;
      });

      if (datosFiltrados.length === 0) {
        alert("No hay registros en ese rango.");
        return;
      }

      let csv = "Nombre,Fecha,Hora,Rol,Sede,Dirección,Tipo\n";
      datosFiltrados.forEach(i => {
        const fecha = i.timestamp.toDate().toLocaleDateString("es-AR");
        const hora = i.timestamp.toDate().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", hour12: false });
        csv += `"${i.nombre || ''}","${fecha}","${hora}","${i.rol || ''}","${i.sede || ''}","${i.direccion || ''}","${i.tipo || 'entrada'}"\n`;
      });

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.setAttribute("download", "ingresos_hakkyo.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    const q = query(collection(db, "ingresos"), orderBy("timestamp", "desc"));
    onSnapshot(q, (snapshot) => {
      cache = snapshot.docs.map(doc => doc.data());
      renderizar(cache);
    });

    document.getElementById("btn-actualizar").addEventListener("click", () => {
  location.reload(); // Fuerza recarga limpia del panel
});

function exportarAnalisisPro() {
  if (!cache || cache.length === 0) {
    alert("No hay datos cargados.");
    return;
  }

  const tardanzas = {};
  const porMes = {};

  for (const ingreso of cache) {
    const nombre = ingreso.nombre || "Sin nombre";
    const rol = ingreso.rol || "Sin rol";
    const tipo = ingreso.tipo || "entrada";
    const fechaObj = ingreso.timestamp?.toDate?.();

    if (!fechaObj || tipo !== "entrada") continue;

    const fecha = fechaObj.toLocaleDateString("es-AR");
    const hora = fechaObj.toTimeString().split(" ")[0];
    const [h, m] = hora.split(":").map(Number);

    const turno = h < 12 ? "mañana" : "tarde";
    const esTarde = (turno === "mañana" && (h > 7 || (h === 7 && m > 0))) ||
                    (turno === "tarde" && (h > 15 || (h === 15 && m > 0)));

    const mes = fechaObj.toLocaleString("es-AR", { month: "long", year: "numeric" });
    const clave = `${nombre} - ${rol}`;

    if (!tardanzas[clave]) tardanzas[clave] = {};
    if (!tardanzas[clave][mes]) tardanzas[clave][mes] = { mañana: 0, tarde: 0 };

    if (esTarde) {
      tardanzas[clave][mes][turno]++;
    }

    // Acumulador para gráfico por persona
    if (!porMes[clave]) porMes[clave] = 0;
    if (esTarde) porMes[clave]++;
  }

  // Generar Excel
  const rows = [["Nombre - Rol", "Mes", "Tardes Mañana", "Tardes Tarde", "Total"]];
  for (const persona in tardanzas) {
    for (const mes in tardanzas[persona]) {
      const man = tardanzas[persona][mes].mañana || 0;
      const tar = tardanzas[persona][mes].tarde || 0;
      rows.push([persona, mes, man, tar, man + tar]);
    }
  }

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, ws, "Tardanzas");
  XLSX.writeFile(wb, "analisis_tardanzas.xlsx");

  // Generar gráfico
  const ctx = document.getElementById("graficoTardes").getContext("2d");
  const etiquetas = Object.keys(porMes);
  const valores = Object.values(porMes);

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: etiquetas,
      datasets: [{
        label: "Llegadas Tarde (Total)",
        data: valores,
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        title: { display: true, text: "Tardanzas por persona (total por mes)" }
      },
      scales: {
        y: {
          beginAtZero: true,
          ticks: { stepSize: 1 }
        }
      }
    }
  });
}

window.exportarAnalisisPro = exportarAnalisisPro;


  </script>
  <!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- SheetJS (xlsx) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

</body>
</html>
