<!DOCTYPE html>

<head>

<body>
  <div id="login-section" class="container">
    <h1>Ingreso Administrador</h1>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Contraseña" />
    <button id="loginBtn">Ingresar</button>

  </div>

  <div id="admin-panel" style="display:none">
    <div class="container">
      <h1>Panel de Administracion</h1>

      <div class="filtros-container">
        <button class="toggle-filtros" onclick="document.querySelector('.filtros-desplegable').classList.toggle('abierto')">🎛️ Mostrar/Ocultar filtros</button>
        <button id="btn-actualizar">🔄 Actualizar</button>

        <div class="filtros-desplegable">
          <div class="filtro-izquierda">
            <select id="filtro-rol">
              <option value="">Todos los roles</option>
              <option value="Recepcionista">Recepcionista</option>
              <option value="Profesor">Profesor</option>
              <option value="Suplente">Suplente</option>
            </select>
            <select id="filtro-sede">
              <option value="">Todas las sedes</option>
              <option value="Santa Fe">Santa Fe</option>
              <option value="Borges">Borges</option>
              <option value="Darregueyra">Darregueyra</option>
              <option value="Lacroze">Lacroze</option>
              <option value="Callao">Callao</option>
              <option value="Subzero">Subzero</option>
              <option value="Ciudad">Ciudad</option>
              <option value="No detectada">No detectada</option>
            </select>
            <select id="filtro-tipo">
              <option value="">Entradas y salidas</option>
              <option value="entrada">Solo entradas</option>
              <option value="salida">Solo salidas</option>
            </select>
            <input type="date" id="filtro-fecha" />

             <div class="filtro-derecha">
          <label for="desde">Desde</label>
          <input type="date" id="fecha-desde" />
          <label for="hasta">Hasta</label>
          <input type="date" id="fecha-hasta" />
          <button onclick="exportarExcel()">📤 Exportar a Excel</button>
          <button onclick="exportarAnalisisPro()">📥 GRAFICO</button>
          <canvas id="graficoTardes" style="max-width:100%; margin-top: 2rem;"></canvas>
        </div>
            <button id="limpiarFiltros">🔄 Limpiar filtros</button>
          </div>
        </div>
      </div>

      <p id="contador-hoy">Ingresos hoy: 0</p>
      <div id="lista-ingresos" class="grid"></div>
      <button onclick="logout()">Cerrar sesión</button>
    </div>
  </div>

  <!-- Firebase y lógica -->
  <script type="module">
     import { initializeApp, getApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getFirestore, collection, query, orderBy, where, limit, startAfter, getDocs,
    setDoc, doc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import {
    getMessaging, getToken, onMessage, isSupported as isMessagingSupported
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWboAJXuO7feFynrKDefFUW2YWNEt3oF0",
      authDomain: "gymhakkyo-ingreso.firebaseapp.com",
      projectId: "gymhakkyo-ingreso",
      storageBucket: "gymhakkyo-ingreso.appspot.com",
      messagingSenderId: "413099978087",
      appId: "1:413099978087:web:cacfd3021a87dc3cd013c2",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

async function enablePushForAdmin() {
    // 1) Soporte real
    let supported = false;
    try { supported = await isMessagingSupported(); } catch { supported = false; }
    if (!supported) { console.warn('[FCM] no soportado'); return; }

    // 2) Service Worker activo
    const swReg = window.__swReg || await navigator.serviceWorker.getRegistration();
    if (!swReg) { console.warn('[PUSH] No hay ServiceWorker registrado.'); return; }

    // 3) Permiso de notificaciones
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return;

    // 4) Token
    const messaging = getMessaging(app);
    const token = await getToken(messaging, {
      vapidKey: "BAsL1i8dAzvPxQyvgRNdqMV6Yd626n1FLwIqbhRmL-L7pIkcL_qjSr9_uYbXzOdqOi57jN_4MRW943myWhvyjzw",
      serviceWorkerRegistration: swReg
    });
    if (!token) { console.warn('[FCM] no se obtuvo token'); return; }

    // 5) Guardar token (ya autenticado)
    await setDoc(doc(db, "adminTokens", token), {
      token, ua: navigator.userAgent, createdAt: serverTimestamp()
    }, { merge: true });
    console.info('[PUSH] Token admin registrado.');

    // 6) Mensajes en primer plano
    onMessage(messaging, (payload) => {
      const title = payload?.notification?.title || payload?.data?.title || "Hakkyo";
      const body  = payload?.notification?.body  || payload?.data?.body  || "";
      try {
        new Notification(title, { body, icon: "//assets/icon-192.png", data: { url: payload?.data?.url || "/admin.html" } });
      } catch {}
    });
  }

  // Esperar sesión y luego activar push
  onAuthStateChanged(auth, (user) => {
    if (user) {
      // ya logueado y tu código de registro de SW corrió en window.load
      enablePushForAdmin();
    } else {
      console.warn('[AUTH] No hay sesión; logueate para activar push.');
    }
  });

    loginBtn.addEventListener("click", async () => {
      const email = document.getElementById("email").value;

onAuthStateChanged(auth, user => {
  if (user && user.email === "admin@gymhakkyo.com.ar") { // 🔐 Cambiá por tu email
    document.getElementById("login-section").style.display = "none";

    cargarRegistros();
    
  } else {

    signOut(auth);
  }
});


    window.logout = () => signOut(auth);


    
    function cargarRegistros() {
    // Variables para controlar la carga
    let lastVisibleDoc = null; // Guardará el último registro visto para saber por dónde seguir
    let isLoading = false;     // Para no hacer clic en "cargar más" muchas veces seguidas
    let cache = [];            // Aquí guardaremos todos los registros que se vayan cargando

    const contenedor = document.getElementById("lista-ingresos");
    const filtroRol = document.getElementById("filtro-rol");
    const filtroSede = document.getElementById("filtro-sede");
    const filtroFecha = document.getElementById("filtro-fecha");
    const filtroTipo = document.getElementById("filtro-tipo");
    const btnLimpiarFiltros = document.getElementById("limpiarFiltros");
    const contadorHoy = document.getElementById("contador-hoy");

    // Esta es la nueva función inteligente que carga los datos por partes
    async function cargarLoteDeRegistros() {
        if (isLoading) return; // Si ya está cargando, no hagas nada
        isLoading = true;
        document.getElementById("lista-ingresos").innerHTML += "<p>Cargando...</p>";

        try {
            // Construimos la consulta a Firebase
            let q = query(collection(db, "ingresos"), orderBy("timestamp", "desc"));

            // Aplicamos los filtros ANTES de descargar. ¡Esto es lo más importante!
            const rol = filtroRol.value;
            const sede = filtroSede.value;
            const tipo = filtroTipo.value;
            const fechaFiltro = filtroFecha.value;

            if (rol) q = query(q, where("rol", "==", rol));
            if (sede) q = query(q, where("sede", "==", sede));
            if (tipo) q = query(q, where("tipo", "==", tipo));
            if (fechaFiltro) {
                const inicioDia = new Date(fechaFiltro + "T00:00:00");
                const finDia = new Date(fechaFiltro + "T23:59:59");
                q = query(q, where("timestamp", ">=", inicioDia), where("timestamp", "<=", finDia));
            }
            
            // Le decimos que traiga solo 25
            q = query(q, limit(25));

            // Si ya hemos cargado una página, le decimos que empiece DESPUÉS del último que vimos
            if (lastVisibleDoc) {
                q = query(q, startAfter(lastVisibleDoc));
            }

            // Ejecutamos la consulta para obtener los documentos
            const snapshot = await getDocs(q);

            // Limpiamos el mensaje "Cargando..."
            let pCargando = document.querySelector("#lista-ingresos p");
            if (pCargando && pCargando.textContent === "Cargando...") {
                pCargando.remove();
            }

            // Guardamos el último documento para la próxima vez
            lastVisibleDoc = snapshot.docs[snapshot.docs.length - 1];

            // Añadimos los nuevos datos al caché
            const nuevosDatos = snapshot.docs.map(doc => doc.data());
            cache = [...cache, ...nuevosDatos];

            renderizar(nuevosDatos, true); // true significa "añadir", no "reemplazar"

            // Gestionamos el botón "Cargar Más"
            const btnCargarMasExistente = document.getElementById("btn-cargar-mas");
            if(btnCargarMasExistente) btnCargarMasExistente.remove();

            if (snapshot.docs.length === 25) { // Si vinieron 25, es probable que haya más
                const btnCargarMas = document.createElement("button");
                btnCargarMas.id = "btn-cargar-mas";
                btnCargarMas.textContent = "👇 Cargar más registros";
                btnCargarMas.style.width = "100%";
                btnCargarMas.style.marginTop = "1rem";
                btnCargarMas.onclick = cargarLoteDeRegistros;
                contenedor.insertAdjacentElement("afterend", btnCargarMas);
            }

        } catch (error) {
            console.error("Error al cargar registros: ", error);
            document.getElementById("lista-ingresos").innerHTML = "<p>Hubo un error. Revisa la consola (F12) para ver los detalles. Es posible que necesites crear un índice en Firebase.</p>";
        } finally {
            isLoading = false;
        }
    }

    // La función que dibuja los registros en la pantalla
    function renderizar(data, adjuntar = false) {
        if (!adjuntar) {
            contenedor.innerHTML = "";
        }
        
        // El contador de ingresos de hoy puede seguir funcionando como antes
        const hoy = new Date().toISOString().slice(0, 10);
        const ingresosHoy = cache.filter(i => {
            const f = i.timestamp?.toDate?.().toISOString().slice(0, 10);
            return f === hoy && i.tipo !== 'salida';
        }).length;
        contadorHoy.textContent = `Ingresos hoy: ${ingresosHoy}`;
        
        data.forEach(item => {
            const fecha = item.timestamp?.toDate?.().toLocaleDateString("es-AR") || "Sin fecha";
            const hora = item.timestamp?.toDate?.().toLocaleTimeString("es-AR", {
                hour: "2-digit", minute: "2-digit", hour12: false
            }) || item.hora || "Sin hora";

            const div = document.createElement("div");
            div.classList.add("ingreso");
            div.innerHTML = `
                <p><strong>🧑‍💼 ${item.tipo === "salida" ? "Salida" : "Ingreso"}</strong></p>
                <p><strong>Rol:</strong> ${item.rol || "N/A"}</p>
                <p><strong>Nombre:</strong> ${item.nombre || "No informado"}</p>
                <p><strong>Dirección:</strong> ${item.direccion || "No disponible"}</p>
                <p><strong>Sede:</strong> ${item.sede || "No detectada"}</p>
                <p><strong>Fecha:</strong> ${fecha}</p>
                <p><strong>Hora:</strong> ${hora}</p>
                <img src="${item.imagenBase64}" alt="Selfie" loading="lazy"/>
            `;
            contenedor.appendChild(div);
        });
    }

    // Esta función reinicia todo cuando cambias un filtro
    function aplicarFiltrosYRecargar() {
        cache = [];
        lastVisibleDoc = null;
        contenedor.innerHTML = "";
        const btnCargarMasExistente = document.getElementById("btn-cargar-mas");
        if(btnCargarMasExistente) btnCargarMasExistente.remove();
        cargarLoteDeRegistros();
    }

    // Conectamos los filtros a la nueva función de recarga
    filtroRol.addEventListener("change", aplicarFiltrosYRecargar);
    filtroSede.addEventListener("change", aplicarFiltrosYRecargar);
    filtroTipo.addEventListener("change", aplicarFiltrosYRecargar);
    filtroFecha.addEventListener("change", aplicarFiltrosYRecargar);
    
    btnLimpiarFiltros.addEventListener("click", () => {
        filtroRol.value = "";
        filtroSede.value = "";
        filtroFecha.value = "";
        filtroTipo.value = "";
        aplicarFiltrosYRecargar();
    });

    document.getElementById("btn-actualizar").addEventListener("click", () => {
        location.reload(); // El botón de actualizar simplemente recarga la página
    });

    // ¡Esta es la primera carga de datos cuando la página abre!
    aplicarFiltrosYRecargar();
}

window.exportarExcel = async () => {
    const btn = document.querySelector('button[onclick="exportarExcel()"]');
    if (btn) { btn.disabled = true; btn.textContent = "⏳ Exportando..."; }

    try {
      // Usamos el XLSX global del <script> del final del HTML
      if (typeof XLSX === "undefined") {
        alert("XLSX no está disponible. Revisá el <script> al final del HTML.");
        return;
      }

      // 1) Leer filtros actuales desde el DOM
      const rol = document.getElementById("filtro-rol").value;
      const sede = document.getElementById("filtro-sede").value;
      const tipo = document.getElementById("filtro-tipo").value;
      const fechaUnica = document.getElementById("filtro-fecha").value;  // YYYY-MM-DD
      const desdeStr = document.getElementById("fecha-desde").value;      // YYYY-MM-DD
      const hastaStr = document.getElementById("fecha-hasta").value;      // YYYY-MM-DD

      // 2) Armar rango de fechas: si hay fecha única, tiene prioridad
      let inicio = null, fin = null;
      if (fechaUnica) {
        inicio = new Date(fechaUnica + "T00:00:00");
        fin    = new Date(fechaUnica + "T23:59:59");
      } else {
        if (desdeStr) inicio = new Date(desdeStr + "T00:00:00");
        if (hastaStr) fin    = new Date(hastaStr + "T23:59:59");
      }

      // 3) Construir la query base con filtros + orden por timestamp (requerido para el rango)
      let qBase = query(collection(db, "ingresos"), orderBy("timestamp", "desc"));
      if (rol)  qBase = query(qBase, where("rol", "==", rol));
      if (sede) qBase = query(qBase, where("sede", "==", sede));
      if (tipo) qBase = query(qBase, where("tipo", "==", tipo));
      if (inicio) qBase = query(qBase, where("timestamp", ">=", inicio));
      if (fin)    qBase = query(qBase, where("timestamp", "<=",   fin));

      // 4) Bajar TODO con paginación
      const batchSize = 500;
      let all = [];
      let lastDoc = null;

      while (true) {
        const qPage = lastDoc
          ? query(qBase, startAfter(lastDoc), limit(batchSize))
          : query(qBase, limit(batchSize));

        const snap = await getDocs(qPage);
        if (snap.empty) break;

        all.push(...snap.docs.map(d => ({ id: d.id, ...d.data() })));
        lastDoc = snap.docs[snap.docs.length - 1];
        if (snap.size < batchSize) break; // última página
      }

      if (all.length === 0) {
        alert("No hay registros para exportar con los filtros/rango actuales.");
        return;
      }

      // 5) Transformar a filas de Excel (fecha/hora legibles + cálculo de horario programado)
      const sedesEspeciales = ["Subzero", "Lacroze"];
      const pad2 = (n) => String(n).padStart(2, "0");
      const toMinutes = (hhmm) => {
        const [h, m] = (hhmm || "").split(":").map(Number);
        return isFinite(h) && isFinite(m) ? h * 60 + m : null;
      };
      const toHHMM = (min) => `${pad2(Math.floor(min / 60))}:${pad2(min % 60)}`;

      const rows = all.map(rec => {
        const dt = rec.timestamp?.toDate?.() ? rec.timestamp.toDate() : null;
        const fecha = dt ? `${pad2(dt.getDate())}/${pad2(dt.getMonth()+1)}/${dt.getFullYear()}` : "";
        const hora  = dt ? `${pad2(dt.getHours())}:${pad2(dt.getMinutes())}` : (rec.hora || "");
        const sedeVal = rec.sede || "No detectada";
        const tipoVal = rec.tipo === "salida" ? "Salida" : "Entrada";

        // Por defecto: si no hay sede válida, no calculamos programado
        let horarioProg = "N/A";
        let diffMin = "";

        if (sedeVal && sedeVal !== "No detectada" && hora) {
          const fichMin = toMinutes(hora);
          if (fichMin !== null) {
            const esManiana = fichMin < 900; // 15:00
            let baseEnt, baseSal;
            if (esManiana) {
              baseEnt = sedesEspeciales.includes(sedeVal) ? 450 : 420; // 7:30 / 7:00
              baseSal = 900; // 15:00
            } else {
              baseEnt = 900;  // 15:00
              baseSal = sedesEspeciales.includes(sedeVal) ? 1350 : 1380; // 22:30 / 23:00
            }
            if (rec.tipo === "entrada") { horarioProg = toHHMM(baseEnt); diffMin = fichMin - baseEnt; }
            else                         { horarioProg = toHHMM(baseSal); diffMin = fichMin - baseSal; }
          }
        }

        return {
          "Tipo de Registro": tipoVal,
          "Rol": rec.rol || "",
          "Nombre": rec.nombre || "",
          "Dirección": rec.direccion || "",
          "Sede": sedeVal,
          "Fecha": fecha,
          "Hora": hora,
          "Horario Programado": horarioProg,
          "Diferencia (minutos)": diffMin
        };
      });

      // 6) Armar y descargar el Excel
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet(rows);
      ws["!cols"] = Object.keys(rows[0]).map(k => ({ wch: Math.max(18, k.length) }));
      XLSX.utils.book_append_sheet(wb, ws, "Registros Hakkyo");

      const nombreArchivo =
        `registros-${fechaUnica || (desdeStr || "ini") + "_" + (hastaStr || "fin")}.xlsx`;
      XLSX.writeFile(wb, nombreArchivo);

    } catch (err) {
      console.error(err);
      alert("Error exportando. Mirá la consola (F12). Es posible que Firestore te pida crear un índice.");
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = "📤 Exportar a Excel"; }
    }
  };

  window.exportarAnalisisPro = () => {
    const sedesEspeciales = ["Subzero", "Lacroze"];
    const datos = {}; // 👈 Asegurate de que ESTA línea esté ADENTRO de la función

    document.querySelectorAll(".ingreso").forEach(div => {
      // Normaliza el nombre para agrupar
      function normalizarNombre(nombre) {
        return (nombre || "")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9]/g, "");
      }

      const nombreRaw = div.querySelector("p:nth-child(3)")?.textContent.split(":")[1]?.trim() || "No informado";
      const nombre = normalizarNombre(nombreRaw);

      const tipoTexto = div.querySelector("p strong")?.textContent?.toLowerCase() || "";
      const tipo = tipoTexto.includes("salida") ? "salida" : "entrada";
      const sede = div.querySelector("p:nth-child(5)")?.textContent.split(":")[1]?.trim() || "";
      const horaStr = div.querySelector("p:nth-child(7)")?.textContent.split(":")[1]?.trim() || "";

      // Convertir hora a minutos
      const [h, m] = (horaStr || "00:00").split(":").map(Number);
      const minutos = h * 60 + m;
      const esManiana = minutos < 900; // 15:00
      const esEspecial = sedesEspeciales.includes(sede);

      let baseEntrada, baseSalida;
      if (esManiana) {
        baseEntrada = esEspecial ? 450 : 420; // 7:30 / 7:00
        baseSalida  = 900;                    // 15:00
      } else {
        baseEntrada = 900;                    // 15:00
        baseSalida  = esEspecial ? 1350 : 1380; // 22:30 / 23:00
      }

      const clave = nombre;

      if (!datos[clave]) {
        datos[clave] = { tardeManana: 0, tardeTarde: 0, antesManana: 0, antesTarde: 0 };
      }

      if (tipo === "entrada" && minutos > baseEntrada) {
        esManiana ? datos[clave].tardeManana++ : datos[clave].tardeTarde++;
      }
      if (tipo === "salida" && minutos < baseSalida) {
        esManiana ? datos[clave].antesManana++ : datos[clave].antesTarde++;
      }
    });

    // Armar datos del gráfico
    const labels = Object.keys(datos);
    const tardeManana = labels.map(n => datos[n].tardeManana);
    const tardeTarde  = labels.map(n => datos[n].tardeTarde);
    const antesManana = labels.map(n => datos[n].antesManana);
    const antesTarde  = labels.map(n => datos[n].antesTarde);

    // Asegurá que el canvas exista y sea visible
    const canvas = document.getElementById("graficoTardes");
    if (!canvas) return alert("No encontré el canvas del gráfico.");
    const filtros = document.querySelector(".filtros-desplegable");
    if (filtros) filtros.classList.add("abierto");

    // Evitar superposición de gráficos
    if (window.__chartTardes) window.__chartTardes.destroy();

    const ctx = canvas.getContext("2d");
    window.__chartTardes = new Chart(ctx, {
      type: "bar",
      data: {
        labels,
        datasets: [
          { label: "🟡 Llegó tarde (mañana)", data: tardeManana, backgroundColor: "rgba(255, 206, 86, 0.7)" },
          { label: "🟠 Llegó tarde (tarde)" , data: tardeTarde , backgroundColor: "rgba(255, 159, 64, 0.7)" },
          { label: "🔵 Se fue antes (mañana)", data: antesManana, backgroundColor: "rgba(54, 162, 235, 0.7)" },
          { label: "🔴 Se fue antes (tarde)" , data: antesTarde , backgroundColor: "rgba(255, 99, 132, 0.7)" }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { position: "top" }, title: { display: true, text: "Tardanzas y salidas anticipadas" } },
        scales: {
          x: { title: { display: true, text: "Personas" } },
          y: { beginAtZero: true, title: { display: true, text: "Cantidad de veces" } }
        }
      }
    });
  };


  </script>
