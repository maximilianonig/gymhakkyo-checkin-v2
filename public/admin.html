<!-- ... HEAD ... -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel de Ingresos</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<!-- ... BODY ... -->
<body>
  <div id="loginForm">
    <h2>Login Admin</h2>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Contraseña" />
    <button id="loginBtn">Ingresar</button>
    <p id="errorMsg" style="color: red;"></p>
  </div>

  <div id="adminPanel" style="display: none;">
    <button id="logout">Cerrar sesión</button>
    <h1>🧾 Registro de Ingresos</h1>

<div class="filtros-container">
  <button class="toggle-filtros" onclick="document.querySelector('.filtros-desplegable').classList.toggle('abierto')">
    🎛️ Mostrar/Ocultar filtros
  </button>

  <div class="filtros-desplegable">
    <div class="filtro-izquierda">
      <select id="filtro-rol">
        <option value="">Todos los roles</option>
        <option value="Recepcionista">Recepcionista</option>
        <option value="Profesor">Profesor</option>
        <option value="Suplente">Suplente</option>
      </select>

      <select id="filtro-sede">
        <option value="">Todas las sedes</option>
        <option value="Santa Fe">Santa Fe</option>
        <option value="Borges">Borges</option>
        <option value="Darregueyra">Darregueyra</option>
        <option value="Lacroze">Lacroze</option>
        <option value="Callao">Callao</option>
        <option value="Subzero">Subzero</option>
        <option value="Ciudad">Ciudad</option>
        <option value="No detectada">No detectada</option>
      </select>

      <input type="date" id="filtro-fecha" />
      <button id="limpiarFiltros">🔄 Limpiar filtros</button>
    </div>

    <div class="filtro-derecha">
      <label>Desde: <input type="date" id="export-desde" /></label>
      <label>Hasta: <input type="date" id="export-hasta" /></label>
      <button id="exportarExcel">📁 Exportar a Excel</button>
    </div>
  </div>
</div>


    <div id="lista-ingresos" class="grid"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";
    import {
      getFirestore,
      collection,
      onSnapshot,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWboAJXuO7feFynrKDefFUW2YWNEt3oF0",
      authDomain: "gymhakkyo-ingreso.firebaseapp.com",
      projectId: "gymhakkyo-ingreso",
      storageBucket: "gymhakkyo-ingreso.appspot.com",
      messagingSenderId: "413099978087",
      appId: "1:413099978087:web:cacfd3021a87dc3cd013c2",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginForm = document.getElementById("loginForm");
    const adminPanel = document.getElementById("adminPanel");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logout");

    const contenedor = document.getElementById("lista-ingresos");
    const filtroRol = document.getElementById("filtro-rol");
    const filtroSede = document.getElementById("filtro-sede");
    const filtroFecha = document.getElementById("filtro-fecha");
    const btnLimpiarFiltros = document.getElementById("limpiarFiltros");
    const btnExportarExcel = document.getElementById("exportarExcel");
    const exportDesde = document.getElementById("export-desde");
    const exportHasta = document.getElementById("export-hasta");

    let cache = [];

    function renderizar(data) {
      const rol = filtroRol.value.toLowerCase();
      const sede = filtroSede.value.toLowerCase();
      const fechaFiltro = filtroFecha.value;

      contenedor.innerHTML = "";

      const filtrado = data.filter(item => {
        const itemRol = item.rol?.toLowerCase() || "";
        const itemSede = item.sede?.toLowerCase() || "";

        let itemFecha = "";
        if (item.timestamp?.toDate) {
          itemFecha = item.timestamp.toDate().toISOString().slice(0, 10);
        }

        const cumpleRol = !rol || itemRol === rol;
        const cumpleSede = !sede || itemSede === sede;
        const cumpleFecha = !fechaFiltro || itemFecha === fechaFiltro;

        return cumpleRol && cumpleSede && cumpleFecha;
      });

      filtrado.forEach(data => {
        const fecha = data.timestamp?.toDate?.().toLocaleDateString("es-AR") || "Sin fecha";

        const hora = data.timestamp?.toDate?.().toLocaleTimeString("es-AR", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        }) || data.hora || "Sin hora";

        const div = document.createElement("div");
        div.classList.add("ingreso");
        div.innerHTML = `
          <p><strong>🧑‍💼 Rol:</strong> ${data.rol || "N/A"}</p>
          <p><strong>🙋 Nombre:</strong> ${data.nombre || "No informado"}</p>
          <p><strong>📍 Dirección:</strong> ${data.direccion || "No disponible"}</p>
          <p><strong>🏢 Sede:</strong> ${data.sede || "No detectada"}</p>
          <p><strong>📅 Fecha:</strong> ${fecha}</p>
          <p><strong>🕒 Hora:</strong> ${hora}</p>
          <img src="${data.imagenBase64}" alt="Selfie"/>
        `;
        contenedor.appendChild(div);
      });

      // Excel export
      btnExportarExcel.onclick = () => {
        const desde = exportDesde.value;
        const hasta = exportHasta.value;

        const exportFiltrado = cache.filter(item => {
          const fechaISO = item.timestamp?.toDate?.().toISOString().slice(0, 10);
          if (!fechaISO) return false;

          const cumpleDesde = !desde || fechaISO >= desde;
          const cumpleHasta = !hasta || fechaISO <= hasta;
          return cumpleDesde && cumpleHasta;
        });

        const rows = exportFiltrado.map(i => ({
          Rol: i.rol || "",
          Nombre: i.nombre || "",
          Dirección: i.direccion || "",
          Sede: i.sede || "",
          Fecha: i.timestamp?.toDate?.().toLocaleDateString("es-AR") || "",
          Hora: i.timestamp?.toDate?.().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", hour12: false }) || "",
        }));

        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Ingresos");
        XLSX.writeFile(wb, `ingresos_${desde || "inicio"}_a_${hasta || "hoy"}.xlsx`);
      };
    }

    filtroRol.addEventListener("change", () => renderizar(cache));
    filtroSede.addEventListener("change", () => renderizar(cache));
    filtroFecha.addEventListener("change", () => renderizar(cache));
    btnLimpiarFiltros.addEventListener("click", () => {
      filtroRol.value = "";
      filtroSede.value = "";
      filtroFecha.value = "";
      exportDesde.value = "";
      exportHasta.value = "";
      renderizar(cache);
    });

    loginBtn.addEventListener("click", () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      signInWithEmailAndPassword(auth, email, password)
        .catch(error => {
          document.getElementById("errorMsg").textContent = error.message;
        });
    });

    logoutBtn.addEventListener("click", () => {
      signOut(auth);
    });

    onAuthStateChanged(auth, user => {
      if (user) {
        loginForm.style.display = "none";
        adminPanel.style.display = "block";

        const q = query(collection(db, "ingresos"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
          cache = snapshot.docs.map(doc => doc.data());
          renderizar(cache);
        });

      } else {
        loginForm.style.display = "block";
        adminPanel.style.display = "none";
      }
    });
  </script>
</body>
