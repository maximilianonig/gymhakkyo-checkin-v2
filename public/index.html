<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gym Hakkyo - Ingreso</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js')
        .then(reg => console.log("Service Worker registrado", reg))
        .catch(err => console.warn("Error al registrar el Service Worker", err));
    });
  }
</script>
</head>
<body>
  
  <div id="indicador-conexion" class="indicador-conexion">
    <span id="icono-conexion">🟢</span> <span id="texto-conexion">Conectado</span>
  </div>

  <div class="container">
    <img src="./assets/hakkyogymsinfondo.png" alt="Logo Gym Hakkyo" class="logo" />
    <h1>Registro de Ingreso</h1>

    <label for="rol">Seleccioná tu rol:</label>
    <select id="rol">
      <option value="">-- Elegí una opción --</option>
      <option value="Recepcionista">Recepcionista</option>
      <option value="Profesor">Profesor</option>
      <option value="Suplente">Suplente</option>
    </select>

    <label for="accion">¿Qué querés fichar?</label>
    <select id="accion">
      <option value="entrada">Entrada</option>
      <option value="salida">Salida</option>
    </select>

    <label for="nombre">Tu nombre y apellido (opcional):</label>
    <input type="text" id="nombre" placeholder="Ej: Valeria Gómez" />
<div id="estado" class="estado">📡 Obteniendo ubicación...</div>
    <video id="video" autoplay playsinline></video>
    <button id="btn-capturar" disabled>📸 Sacar Selfie</button>
  </div>

  <canvas id="canvas" style="display: none;"></canvas>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js';
    import {
      getFirestore, collection, addDoc, serverTimestamp
    } from 'https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBWboAJXuO7feFynrKDefFUW2YWNEt3oF0",
      authDomain: "gymhakkyo-ingreso.firebaseapp.com",
      projectId: "gymhakkyo-ingreso",
      storageBucket: "gymhakkyo-ingreso.appspot.com",
      messagingSenderId: "413099978087",
      appId: "1:413099978087:web:cacfd3021a87dc3cd013c2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const btn = document.getElementById('btn-capturar');
    const estado = document.getElementById('estado');

    let lat = null;
    let lng = null;
    let direccion = "Ubicación no disponible";

    const sedes = [
      { nombre: "Santa Fe", lat: -34.58088797316031, lng: -58.422237561895855 },
      { nombre: "Borges", lat: -34.58261928715806, lng: -58.4217225777634 },
      { nombre: "Darregueyra", lat: -34.58003996945938, lng: -58.42372887010865 },
      { nombre: "Lacroze", lat: -34.584525644812175, lng: -58.453875488879135 },
      { nombre: "Callao", lat: -34.59930181440179, lng: -58.39323926004223 },
      { nombre: "Subzero", lat: -34.614264047812114, lng: -58.38948140422186 },
      { nombre: "Ciudad", lat: -34.543588364646936, lng: -58.45859547538972 }
    ];

    function distanciaMetros(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const rad = Math.PI / 180;
      const dLat = (lat2 - lat1) * rad;
      const dLon = (lon2 - lon1) * rad;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function detectarSedePorCoordenadas(latActual, lngActual) {
      let sedeDetectada = "No detectada";
      let menorDistancia = Infinity;

      for (const sede of sedes) {
        const dist = distanciaMetros(latActual, lngActual, sede.lat, sede.lng);
        if (dist < 10 && dist < menorDistancia) {
          menorDistancia = dist;
          sedeDetectada = sede.nombre;
        }
      }
      return sedeDetectada;
    }

    async function obtenerDireccion(lat, lng) {
      try {
        const res = await fetch(`https://us-central1-gymhakkyo-ingreso.cloudfunctions.net/api/reverse-geocode?lat=${lat}&lng=${lng}`);
        const data = await res.json();
        return data.direccion || "Ubicación no disponible";
      } catch (e) {
        return "Ubicación no disponible";
      }
    }

    function mostrarEstado(texto) {
      estado.textContent = texto;
      estado.style.display = "block";
    }

    function actualizarIndicadorConexion() {
      const icono = document.getElementById("icono-conexion");
      const texto = document.getElementById("texto-conexion");
      const conectado = navigator.onLine;

      icono.textContent = conectado ? "🟢" : "🔴";
      texto.textContent = conectado ? "Conectado" : "Sin conexión";
    }

    let deferredPrompt;
const btnInstalar = document.getElementById("btn-instalar");

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  btnInstalar.style.display = "inline-block";
});

btnInstalar.addEventListener("click", async () => {
  if (!deferredPrompt) return;
  btnInstalar.style.display = "none";
  deferredPrompt.prompt();
  const result = await deferredPrompt.userChoice;
  if (result.outcome === 'accepted') {
    mostrarEstado("✅ App instalada correctamente.");
  } else {
    mostrarEstado("❌ Instalación cancelada.");
  }
  deferredPrompt = null;
});


    async function guardarIngreso(data) {
      const clave = `${data.rol}-${data.nombre || "anonimo"}`;

      if (!navigator.onLine) {
        // VALIDACIÓN: No se puede guardar salida sin entrada previa
        if (data.tipo === "salida") {
          const activos = JSON.parse(localStorage.getItem("fichajesActivos") || "{}");
          if (!activos[clave]) {
            alert("⚠️ No se puede registrar una salida sin haber fichado una entrada.");
            return;
          }
          delete activos[clave];
          localStorage.setItem("fichajesActivos", JSON.stringify(activos));
        } else if (data.tipo === "entrada") {
          const activos = JSON.parse(localStorage.getItem("fichajesActivos") || "{}");
          activos[clave] = true;
          localStorage.setItem("fichajesActivos", JSON.stringify(activos));
        }

        const pendientes = JSON.parse(localStorage.getItem("ingresosPendientes") || "[]");
        pendientes.push({ ...data, fechaLocal: new Date().toISOString() });
        localStorage.setItem("ingresosPendientes", JSON.stringify(pendientes));
        mostrarEstado("📴 Sin conexión: guardado local.");
        return;
      }

      // Guardado online
      try {
        await addDoc(collection(db, "ingresos"), {
          ...data,
          timestamp: serverTimestamp()
        });
        mostrarEstado("✅ Ingreso registrado correctamente.");
      } catch (err) {
        console.error("Error al guardar en línea:", err);
        alert("❌ Error al guardar. Intentá de nuevo.");
      }
    }

    async function sincronizarPendientes() {
      const pendientes = JSON.parse(localStorage.getItem("ingresosPendientes") || "[]");
      if (pendientes.length === 0) return;

      for (const ingreso of pendientes) {
        try {
          await addDoc(collection(db, "ingresos"), {
            ...ingreso,
            timestamp: serverTimestamp()
          });
        } catch (err) {
          console.error("❌ Error al sincronizar:", err);
          return;
        }
      }

      localStorage.removeItem("ingresosPendientes");
      localStorage.removeItem("fichajesActivos");
      mostrarEstado("✔️ Fichajes pendientes sincronizados.");
    }

    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => { video.srcObject = stream; })
      .catch(err => { mostrarEstado("❌ Error accediendo a la cámara"); });

    navigator.geolocation.getCurrentPosition(async (pos) => {
      lat = pos.coords.latitude;
      lng = pos.coords.longitude;
      direccion = await obtenerDireccion(lat, lng);
      mostrarEstado("✅ Ubicación lista. Ya podés fichar.");
      btn.disabled = false;
    }, () => {
      mostrarEstado("⚠️ No se pudo obtener ubicación.");
      btn.disabled = false;
    });

    btn.addEventListener("click", async () => {
      const rol = document.getElementById("rol").value;
      const accion = document.getElementById("accion").value;
      const nombre = document.getElementById("nombre").value.trim();

      if (!rol || !accion) return alert("⚠️ Completá los datos obligatorios.");

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      const imagenBase64 = canvas.toDataURL('image/jpeg');

      const sede = detectarSedePorCoordenadas(lat, lng);
      const hora = new Date().toLocaleString("es-AR");

      await guardarIngreso({
        tipo: accion,
        rol,
        nombre: nombre || null,
        direccion,
        sede,
        imagenBase64,
        hora
      });
    });

    window.addEventListener("online", () => {
      actualizarIndicadorConexion();
      sincronizarPendientes();
    });
    window.addEventListener("offline", actualizarIndicadorConexion);
    actualizarIndicadorConexion();
  

// Mostrar siempre en Android (Chrome/Edge)
function esAndroid() {
  return /android/i.test(navigator.userAgent);
}

if (esAndroid()) {
  btnInstalar.style.display = "block";
}

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
});

btnInstalar.addEventListener("click", async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const result = await deferredPrompt.userChoice;
    if (result.outcome === 'accepted') {
      mostrarEstado("✅ App instalada correctamente.");
    } else {
      mostrarEstado("❌ Instalación cancelada.");
    }
    deferredPrompt = null;
  } else {
    alert("📲 Para instalar esta app:\n1. Tocá los tres puntos arriba a la derecha en Chrome\n2. Elegí 'Agregar a pantalla de inicio'");
  }
});

    
    
  </script>

  <button id="btn-instalar" style="display:none;" class="btn-instalar">
  📲 Instalar App
</button>

</body>
</html>
