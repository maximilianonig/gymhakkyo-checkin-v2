<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gym Hakkyo - Ingreso</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="favicon.png" type="image/png" />
</head>
<body>
  <div class="container">
    <img src="./assets/hakkyogymsinfondo.png" alt="Logo Gym Hakkyo" class="logo" />
    <h1>Registro de Ingreso</h1>

    <label for="rol">Seleccioná tu rol:</label>
    <select id="rol">
      <option value="">-- Elegí una opción --</option>
      <option value="Recepcionista">Recepcionista</option>
      <option value="Profesor">Profesor</option>
      <option value="Suplente">Suplente</option>
    </select>

    <label for="accion">¿Qué querés fichar?</label>
    <select id="accion">
      <option value="entrada">Entrada</option>
      <option value="salida">Salida</option>
    </select>

    <label for="nombre">Tu nombre y apellido (opcional):</label>
    <input type="text" id="nombre" placeholder="Ej: Valeria Gómez" />

    <p id="estado">📡 Obteniendo ubicación...</p>

    <video id="video" autoplay playsinline></video>
    <button id="btn-capturar" disabled>📸 Sacar Selfie</button>
  </div>

  <canvas id="canvas" style="display: none;"></canvas>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js';
    import {
      getFirestore, collection, addDoc, serverTimestamp,
      query, where, getDocs, Timestamp
    } from 'https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBWboAJXuO7feFynrKDefFUW2YWNEt3oF0",
      authDomain: "gymhakkyo-ingreso.firebaseapp.com",
      projectId: "gymhakkyo-ingreso",
      storageBucket: "gymhakkyo-ingreso.appspot.com",
      messagingSenderId: "413099978087",
      appId: "1:413099978087:web:cacfd3021a87dc3cd013c2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const btn = document.getElementById('btn-capturar');
    const estado = document.getElementById('estado');

    let lat = null;
    let lng = null;
    let direccion = "Ubicación no disponible";

       

    const sedes = [
      { nombre: "Santa Fe", lat: -34.58088797316031, lng: -58.422237561895855 },
      { nombre: "Borges", lat: -34.58261928715806, lng: -58.4217225777634 },
      { nombre: "Darregueyra", lat: -34.58003996945938, lng: -58.42372887010865 },
      { nombre: "Lacroze", lat: -34.584525644812175, lng: -58.453875488879135 },
      { nombre: "Callao", lat: -34.59930181440179, lng: -58.39323926004223 },
      { nombre: "Subzero", lat: -34.614264047812114, lng: -58.38948140422186 },
      { nombre: "Ciudad", lat: -34.543588364646936, lng: -58.45859547538972 }
    ];

    function distanciaMetros(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const rad = Math.PI / 180;
      const dLat = (lat2 - lat1) * rad;
      const dLon = (lon2 - lon1) * rad;
      const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function detectarSedePorCoordenadas(latActual, lngActual) {
      let sedeDetectada = "No detectada";
      let menorDistancia = Infinity;

      for (const sede of sedes) {
        const dist = distanciaMetros(latActual, lngActual, sede.lat, sede.lng);
        if (dist < 250 && dist < menorDistancia) {
          menorDistancia = dist;
          sedeDetectada = sede.nombre;
        }
      }
      return sedeDetectada;
    }

    async function obtenerDireccion(lat, lng) {
      try {
        const res = await fetch(`https://us-central1-gymhakkyo-ingreso.cloudfunctions.net/api/reverse-geocode?lat=${lat}&lng=${lng}`);
        const data = await res.json();
        return data.direccion || "Ubicación no disponible";
      } catch (e) {
        console.error("Error al obtener dirección:", e);
        return "Ubicación no disponible";
      }
    }

    function distanciaLevenshtein(a, b) {
      const m = a.length, n = b.length;
      const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          if (a[i - 1] === b[j - 1]) dp[i][j] = dp[i - 1][j - 1];
          else dp[i][j] = 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
        }
      }
      return dp[m][n];
    }

    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => { video.srcObject = stream; })
      .catch(err => { estado.textContent = "Error accediendo a la cámara"; });

    navigator.geolocation.getCurrentPosition(async (pos) => {
      lat = pos.coords.latitude;
      lng = pos.coords.longitude;
      direccion = await obtenerDireccion(lat, lng);
      estado.textContent = "✅ Ubicación lista. Ya podés fichar.";
      btn.disabled = false;
    }, () => {
      estado.textContent = "⚠️ No se pudo obtener ubicación. Podés fichar sin ella.";
      btn.disabled = false;
    });

    btn.addEventListener("click", async () => {
      const rol = document.getElementById("rol").value;
      const accion = document.getElementById("accion").value;
      const nombre = document.getElementById("nombre").value.trim();

      if (!rol || !accion) return alert("Completá los datos obligatorios.");

      const sede = detectarSedePorCoordenadas(lat, lng);
      const hora = new Date().toLocaleString("es-AR");
      const timestamp = Timestamp.now();

      if (accion === "salida") {
        const q = query(
          collection(db, "ingresos"),
          where("sede", "==", sede),
          where("rol", "==", rol),
          where("tipo", "==", "entrada")
        );
        const snap = await getDocs(q);
        const hayCoincidencia = snap.docs.some(doc => {
          const n = (doc.data().nombre || "").toLowerCase();
          return distanciaLevenshtein(n, nombre.toLowerCase()) <= 2;
        });
        if (!hayCoincidencia) {
          estado.textContent = "❌ No se puede fichar salida. Ingreso no registrado.";
          return;
        }
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      const imagenBase64 = canvas.toDataURL('image/jpeg');

      await addDoc(collection(db, "ingresos"), {
        tipo: accion,
        rol,
        nombre: nombre || null,
        direccion,
        sede,
        imagenBase64,
        hora,
        timestamp
      });

      estado.textContent = `✅ ${accion === "entrada" ? "Ingreso" : "Salida"} registrado correctamente en ${sede}`;
    });
  </script>
</body>
</html>
