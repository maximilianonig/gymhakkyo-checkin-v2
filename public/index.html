<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gym Hakkyo - Ingreso</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="favicon.png" type="image/png" />
</head>
<body>
  <div class="container">
    <h1>Registro de Ingreso</h1>

    <label for="rol">Seleccioná tu rol:</label>
    <select id="rol">
      <option value="">-- Elegí una opción --</option>
      <option value="Recepcionista">Recepcionista</option>
      <option value="Profesor">Profesor</option>
      <option value="Suplente">Suplente</option>
    </select>

    <label for="nombre">Tu nombre y apellido (opcional):</label>
    <input type="text" id="nombre" placeholder="Ej: Valeria Gómez" />

    <video id="video" autoplay playsinline></video>
    <button id="btn-capturar" disabled>📸 Sacar Selfie</button>

    <p id="estado"></p>
  </div>

  <canvas id="canvas" style="display: none;"></canvas>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp,
      enableIndexedDbPersistence
    } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWboAJXuO7feFynrKDefFUW2YWNEt3oF0",
      authDomain: "gymhakkyo-ingreso.firebaseapp.com",
      projectId: "gymhakkyo-ingreso",
      storageBucket: "gymhakkyo-ingreso.appspot.com",
      messagingSenderId: "413099978087",
      appId: "1:413099978087:web:cacfd3021a87dc3cd013c2",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    enableIndexedDbPersistence(db).catch((err) => {
      console.warn("⚠️ Persistencia offline no habilitada:", err.code);
    });

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const btn = document.getElementById('btn-capturar');
    const estado = document.getElementById('estado');

    let lat = null;
    let lng = null;
    let direccion = "Ubicación no disponible";

    const sedes = [
      { nombre: "Santa Fe", lat: -34.585536, lng: -58.415892 },
      { nombre: "Borges", lat: -34.584921, lng: -58.426165 },
      { nombre: "Darregueyra", lat: -34.586341, lng: -58.431000 },
      { nombre: "Lacroze", lat: -34.579133, lng: -58.451259 },
      { nombre: "Callao", lat: -34.598178, lng: -58.401611 },
      { nombre: "Subzero", lat: -34.616150, lng: -58.393975 },
      { nombre: "Ciudad", lat: -34.563523, lng: -58.458071 },
    ];

    function distanciaMetros(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const rad = Math.PI / 180;
      const dLat = (lat2 - lat1) * rad;
      const dLon = (lon2 - lon1) * rad;
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function detectarSedePorCoordenadas(latActual, lngActual) {
      let sedeDetectada = "No detectada";
      let menorDistancia = Infinity;

      for (const sede of sedes) {
        const dist = distanciaMetros(latActual, lngActual, sede.lat, sede.lng);
        console.log(`📍 Distancia hasta ${sede.nombre}: ${Math.round(dist)}m`);

        if (dist < 250 && dist < menorDistancia) {
          menorDistancia = dist;
          sedeDetectada = sede.nombre;
        }
      }

      console.log(`✅ Sede detectada: ${sedeDetectada}`);
      return { sedeDetectada, distancia: Math.round(menorDistancia) };
    }

    async function obtenerDireccion(lat, lng) {
      try {
        const res = await fetch(`https://us-central1-gymhakkyo-ingreso.cloudfunctions.net/api/reverse-geocode?lat=${lat}&lng=${lng}`);
        const data = await res.json();
        return data.direccion || "Ubicación no disponible";
      } catch (e) {
        console.error("Error al obtener dirección:", e);
        return "Ubicación no disponible";
      }
    }

    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => { video.srcObject = stream; })
      .catch(err => { estado.textContent = "Error accediendo a la cámara"; });

    estado.textContent = "📡 Obteniendo ubicación...";
    btn.disabled = true;

    const timeout = setTimeout(() => {
      estado.textContent = "⚠️ No se pudo obtener ubicación a tiempo. Podés fichar sin ella.";
      btn.disabled = false;
    }, 5000);

    navigator.geolocation.getCurrentPosition(async (pos) => {
      clearTimeout(timeout);
      lat = pos.coords.latitude;
      lng = pos.coords.longitude;
      direccion = await obtenerDireccion(lat, lng);
      estado.textContent = "✅ Ubicación lista. Ya podés fichar.";
      btn.disabled = false;
    }, (err) => {
      clearTimeout(timeout);
      estado.textContent = "⚠️ No se pudo obtener ubicación. Podés fichar sin ella.";
      btn.disabled = false;
    });

    btn.addEventListener("click", async () => {
      if (btn.disabled) return;

      const rol = document.getElementById('rol').value;
      const nombre = document.getElementById('nombre').value.trim();
      if (!rol) return alert("Elegí un rol");

      btn.disabled = true;
      estado.textContent = "⏳ Registrando ingreso...";

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      const imagenBase64 = canvas.toDataURL('image/jpeg');

      const { sedeDetectada, distancia } = detectarSedePorCoordenadas(lat, lng);
      const hora = new Date().toLocaleString("es-AR");

      try {
        await addDoc(collection(db, "ingresos"), {
          rol,
          nombre: nombre || null,
          direccion,
          sede: sedeDetectada,
          distanciaDetectada: distancia,
          imagenBase64,
          hora,
          timestamp: serverTimestamp()
        });
        estado.textContent = "✅ Ingreso registrado correctamente en " + sedeDetectada;
      } catch (err) {
        console.error("Error al guardar:", err);
        estado.textContent = "❌ Error al guardar";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
